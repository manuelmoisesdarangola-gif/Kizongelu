<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <title>Kizongelu</title>
    <script>
      // Single Page Apps for GitHub Pages
      // MIT License - https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1;
      var l = window.location;

      // Proteção estrita contra loop de redirecionamento
      if (!l.search || l.search[1] !== '/') {
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }
    </script>
  </head>
  <body style="margin: 0; background-color: #F8FAFC; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #0F3D5C;">
    <div style="text-align: center;">
      <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem;">Kizongelu</h2>
      <p style="font-size: 0.875rem; color: #64748B;">A carregar a plataforma...</p>
    </div>
  </body>
</html>
