version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: Kizongelu-postgres
    restart: always
    environment:
      POSTGRES_USER: Kizongelu_user
      POSTGRES_PASSWORD: Kizongelu_password_2026
      POSTGRES_DB: Kizongelu_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Kizongelu_user -d Kizongelu_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
